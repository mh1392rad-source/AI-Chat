const html = `
<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>AI Chat Pro</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b1220;
  color: white;
}

#chat {
  height: 85vh;
  overflow-y: auto;
  padding: 10px;
}

.msg {
  padding: 10px;
  margin: 8px;
  border-radius: 10px;
  max-width: 70%;
  white-space: pre-wrap;
}

.user { background: #2563eb; margin-left: auto; }
.ai { background: #16a34a; margin-right: auto; }

#bar {
  display: flex;
  padding: 10px;
  gap: 10px;
}

input {
  flex: 1;
  padding: 10px;
  border-radius: 6px;
  border: none;
}

button {
  padding: 10px;
  border-radius: 6px;
  border: none;
  background: #2563eb;
  color: white;
}
</style>
</head>

<body>

<div id="chat"></div>

<div id="bar">
  <input id="input" placeholder="پیام بنویس..." />
  <button onclick="send()">ارسال</button>
</div>

<script>
const API = "/chat"; // 👈 مهم: داخلی (دیگه خطا نمی‌ده)

let history = [];

async function send() {
  const input = document.getElementById("input");
  const chat = document.getElementById("chat");

  if (!input.value) return;

  const text = input.value;
  input.value = "";

  chat.innerHTML += `<div class="msg user">${text}</div>`;

  const aiBox = document.createElement("div");
  aiBox.className = "msg ai";
  chat.appendChild(aiBox);

  const res = await fetch(API, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      message: text,
      history: history
    })
  });

  const reader = res.body.getReader();
  const decoder = new TextDecoder();

  let full = "";

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;

    const chunk = decoder.decode(value);
    aiBox.textContent += chunk;
    full += chunk;

    chat.scrollTop = chat.scrollHeight;
  }

  history.push({ role: "user", content: text });
  history.push({ role: "assistant", content: full });
}
</script>

</body>
</html>
`;
