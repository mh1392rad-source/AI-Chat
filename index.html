<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>AI Chat Ultimate</title>

<style>
body{margin:0;font-family:sans-serif;background:#0a0f1f;color:white;display:flex;height:100vh}
.sidebar{width:240px;background:#0f172a;padding:10px}
.chat{flex:1;display:flex;flex-direction:column}
.header{padding:10px;background:#111827;text-align:center}
#box{flex:1;overflow:auto;padding:15px}
.msg{margin:10px;padding:10px;border-radius:10px;max-width:70%;white-space:pre-wrap}
.user{background:#2563eb;margin-left:auto}
.bot{background:#16a34a;margin-right:auto}
.input{display:flex;padding:10px;background:#111827;gap:10px}
input{flex:1;padding:12px;border-radius:8px;border:none}
button{padding:10px;background:#7c3aed;color:white;border:none;border-radius:8px;cursor:pointer}
.small{font-size:12px;opacity:0.7}
</style>

</head>
<body>

<div class="sidebar">
<h3>⚡ ULTIMATE AI</h3>
<button onclick="clearChat()">پاک کردن</button>
<p class="small">✔ Memory<br>✔ Streaming<br>✔ Secure API</p>
</div>

<div class="chat">
<div class="header">🤖 AI CHAT ULTIMATE MODE</div>
<div id="box"></div>

<div class="input">
<input id="txt" placeholder="پیام..." />
<button onclick="send()">ارسال</button>
</div>
</div>

<script>
const API_URL = "https://YOUR-VERCEL-URL.vercel.app/api/chat";

// memory system (smart trim)
let messages = JSON.parse(localStorage.getItem("ultimate_chat")||"[]");

function render(){
  const box=document.getElementById("box");
  box.innerHTML="";
  messages.forEach(m=>{
    box.innerHTML+=<div class="msg "></div>;
  });
  box.scrollTop=box.scrollHeight;
}
render();

async function send(){
  let input=document.getElementById("txt");
  if(!input.value) return;

  messages.push({role:"user",content:input.value});
  render();

  const text=input.value;
  input.value="";

  const res=await fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({messages})
  });

  const data=await res.json();

  let bot={role:"assistant",content:""};
  messages.push(bot);

  let i=0;
  let stream=setInterval(()=>{
    bot.content+=data.reply[i];
    i++;
    render();

    if(i>=data.reply.length){
      clearInterval(stream);
      localStorage.setItem("ultimate_chat",JSON.stringify(messages.slice(-40)));
    }
  },5);
}

function clearChat(){
  messages=[];
  localStorage.removeItem("ultimate_chat");
  render();
}
</script>

</body>
</html>
