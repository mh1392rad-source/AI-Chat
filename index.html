<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>AI Chat Netlify</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#0b1220;
  color:white;
  display:flex;
  height:100vh;
}

.sidebar{
  width:220px;
  background:#0f172a;
  padding:10px;
}

.chat{
  flex:1;
  display:flex;
  flex-direction:column;
}

.header{
  padding:10px;
  background:#111827;
  text-align:center;
}

#box{
  flex:1;
  overflow:auto;
  padding:15px;
}

.msg{
  margin:10px;
  padding:10px;
  border-radius:10px;
  max-width:70%;
  white-space:pre-wrap;
}

.user{
  background:#2563eb;
  margin-left:auto;
}

.bot{
  background:#16a34a;
  margin-right:auto;
}

.input{
  display:flex;
  padding:10px;
  background:#111827;
  gap:10px;
}

input{
  flex:1;
  padding:12px;
  border-radius:8px;
  border:none;
}

button{
  padding:10px;
  background:#7c3aed;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
</style>

</head>

<body>

<div class="sidebar">
<h3>⚡ Netlify AI</h3>
<button onclick="clearChat()">پاک کردن</button>
</div>

<div class="chat">
<div class="header">🤖 AI Chat (Netlify Version)</div>

<div id="box"></div>

<div class="input">
<input id="txt" placeholder="پیام..." />
<button onclick="send()">ارسال</button>
</div>
</div>

<script>
let messages = JSON.parse(localStorage.getItem("chat") || "[]");

function render(){
  const box=document.getElementById("box");
  box.innerHTML="";
  messages.forEach(m=>{
    box.innerHTML+=`<div class="msg ${m.role=='user'?'user':'bot'}">${m.content}</div>`;
  });
  box.scrollTop=box.scrollHeight;
}

render();

// 🧠 fake AI logic (هوشمند ساده)
function fakeAI(text){
  text = text.toLowerCase();

  if(text.includes("سلام")) return "سلام 👋 چطور می‌تونم کمکت کنم؟";
  if(text.includes("اسم")) return "من یک AI ساده هستم 😄";
  if(text.includes("خوبی")) return "من خوبم، تو چطوری؟";
  if(text.includes("who") || text.includes("چی")) return "من یک چت‌بات ساده هستم که روی Netlify اجرا میشم ⚡";

  return "متوجه شدم 👍 ولی برای پاسخ دقیق‌تر باید نسخه AI واقعی وصل بشه.";
}

async function send(){
  const input=document.getElementById("txt");
  if(!input.value) return;

  messages.push({role:"user",content:input.value});
  render();

  const userText = input.value;
  input.value="";

  let bot={role:"assistant",content:""};
  messages.push(bot);

  let reply = fakeAI(userText);

  let i=0;
  let interval=setInterval(()=>{
    bot.content+=reply[i];
    i++;
    render();

    if(i>=reply.length){
      clearInterval(interval);
      localStorage.setItem("chat",JSON.stringify(messages));
    }
  },15);
}

function clearChat(){
  messages=[];
  localStorage.removeItem("chat");
  render();
}
</script>

</body>
</html>
